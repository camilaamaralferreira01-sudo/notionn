<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio em Português</title>

    <style>
        body {
            background-color: #ffffff; /* fundo branco */
            line-height: 1.6;
        }

        .full-table {
            display: table;
            height: 100%;
            width: 100%;
        }

        .table-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }

        .card {
            padding: 10px 25px;
            border-radius: 10px;
            background: #ffffff; /* fundo branco */
            color: #000000; /* letras pretas */
            display: inline-block;
            box-shadow: 2px 2px 5px 0px #000000; /* sombra preta */
            border: 1px solid #000000; /* borda preta para destacar */
        }

        .card:hover {
            margin-top: 2px;
            box-shadow: none;
        }

        .clock {
            display: inline-block;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            font-size: 1.2em;
            color: #000000; /* letras pretas */
        }

        .date {
            display: block;
            font-family: 'Roboto', sans-serif;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #000000; /* letras pretas */
        }

        .greet {
            font-family: 'Roboto', sans-serif;
            font-size: 1.2em;
            margin-bottom: 5px;
            color: #000000; /* letras pretas */
        }
    </style>
</head>
<body>
    <link href="https://fonts.googleapis.com/css?family=Lobster|Roboto:400,700" rel="stylesheet">

    <div class="full-table">
        <div class="table-cell">
            <div class="card">
                <div class="greet" id="greet"></div>
                <div class="date" id="weekday"></div>
                <div class="date" id="daymonth"></div>
                <div class="clock" id="clock"></div>
            </div>
        </div>
    </div>

    <script>
        function capitalizeFirstLetter(text) {
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function dateTime() {
            var today = new Date();

            // Dia da semana em português
            var optionsWeekday = { weekday: 'long' };
            var diaSemana = today.toLocaleDateString('pt-BR', optionsWeekday);
            diaSemana = capitalizeFirstLetter(diaSemana); // primeira letra maiúscula

            // Data completa em português (dia, mês, ano)
            var optionsDate = { year: 'numeric', month: 'long', day: 'numeric' };
            var dataFormatada = today.toLocaleDateString('pt-BR', optionsDate);

            // Hora formatada em português (24h)
            var horaFormatada = today.toLocaleTimeString('pt-BR');

            // Exibe em linhas diferentes
            document.getElementById('weekday').innerHTML = diaSemana;
            document.getElementById('daymonth').innerHTML = dataFormatada;
            document.getElementById('clock').innerHTML = horaFormatada;

            // Saudação em itálico
            var hrs = today.getHours();
            var greet;
            if (hrs < 12)
                greet = '<i>Bom dia</i>';
            else if (hrs >= 12 && hrs <= 17)
                greet = '<i>Boa tarde</i>';
            else
                greet = '<i>Boa noite</i>';

            document.getElementById('greet').innerHTML = greet;

            setTimeout(dateTime, 1000);
        }

        dateTime();
    </script>
</body>
</html>
