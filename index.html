<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio em Português</title>

    <style>
        body {
            background-color: #fff;
            line-height: 1.6;
        }

        h1 {
            margin-top: 0;
        }

        .full-table {
            display: table;
            height: 100%;
            width: 100%;
        }

        .table-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }

        .card {
            padding: 10px 25px 10px 25px;
            border-radius: 10px;
            background: #4f7372;
            color: #fff;
            display: inline-block;
            box-shadow: 2px 2px 1px 0px #295C7B;
        }

        .card:hover {
            margin-top: 2px;
            box-shadow: none;
        }

        .clock {
            display: inline-block;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            font-size: 1.2em;
        }

        .date {
            display: block;
            min-width: 250px;
            font-family: 'Roboto', sans-serif;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .greet {
            min-width: 162px;
            font-family: 'Roboto', sans-serif;
            font-size: 1.2em;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <link href="https://fonts.googleapis.com/css?family=Lobster|Roboto:400,700" rel="stylesheet">

    <div class="full-table">
        <div class="table-cell">
            <div class="card">
                <div class="greet" id="greet"></div>
                <div class="date" id="date"></div>
                <div class="clock" id="clock"></div>
            </div>
        </div>
    </div>

    <script>
        function dateTime() {
            var today = new Date();

            // Dia da semana + data em português
            var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            var dataFormatada = today.toLocaleDateString('pt-BR', options);

            // Hora formatada em português (24h)
            var horaFormatada = today.toLocaleTimeString('pt-BR');

            // Exibe data e hora juntos
            document.getElementById('date').innerHTML = dataFormatada;
            document.getElementById('clock').innerHTML = horaFormatada;

            // Saudação
            var hrs = today.getHours();
            var greet;
            if (hrs < 12)
                greet = 'Bom dia';
            else if (hrs >= 12 && hrs <= 17)
                greet = 'Boa tarde';
            else
                greet = 'Boa noite';

            document.getElementById('greet').innerHTML = greet;

            setTimeout(dateTime, 1000);
        }

        dateTime();
    </script>
</body>
</html>
