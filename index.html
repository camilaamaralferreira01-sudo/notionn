<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio em Português</title>

    <style>
        body {
            background-color: transparent; /* fundo transparente */
            line-height: 1.6;
            font-family: 'Poppins', sans-serif;
        }

        .full-table {
            display: table;
            height: 100%;
            width: 100%;
        }

        .table-cell {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }

        .card {
            padding: 15px 25px;
            border-radius: 10px;
            background: #ffffff; /* bloco sempre branco */
            color: #000000;      /* fonte sempre preta */
            display: inline-block;
            box-shadow: 2px 2px 6px 0px #000000; /* sombra preta */
            border: 1px solid #000000;           /* borda preta */
        }

        .card:hover {
            margin-top: 2px;
            box-shadow: none;
        }

        .clock {
            display: inline-block;
            font-weight: bold;
            font-size: 1.2em;
            color: #000000; /* sempre preto */
            font-family: 'Poppins', sans-serif;
        }

        .date {
            display: block;
            font-size: 1em;
            margin-bottom: 8px;
            color: #000000; /* sempre preto */
            font-family: 'Poppins', sans-serif;
        }

        .greet {
            font-size: 1.2em;
            margin-bottom: 8px;
            color: #000000; /* sempre preto */
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            transform: skewX(-10deg);
        }
    </style>
</head>
<body>
    <!-- Fontes Montserrat e Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <div class="full-table">
        <div class="table-cell">
            <div class="card">
                <div class="greet" id="greet"></div>
                <div class="date" id="weekday"></div>
                <div class="date" id="daymonth"></div>
                <div class="clock" id="clock"></div>
            </div>
        </div>
    </div>
